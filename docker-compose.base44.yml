# Base44 sandbox runbook — serves the static site from the cloned source.
# The repo is plain HTML/CSS/JS, so it is served by a plain nginx runtime image
# with the source bind-mounted (no application image, no build step): edits in
# the repo are picked up on reload.
services:
  web:
    image: nginx:alpine
    container_name: bodren-web
    restart: on-failure
    # The sandbox clones the repo into a 0700 directory that nginx's unprivileged
    # worker user cannot traverse, and the mount is read-only. Run the workers as
    # root (sandbox only) so the bind-mounted source stays readable, then start nginx.
    command:
      [
        "sh",
        "-ec",
        "sed -i 's/^user[[:space:]].*/user root;/' /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'",
      ]
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.base44.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    labels:
      base44.project: "BODRĒN Coffee"
      base44.kind: "web"
      base44.port: "3000"
