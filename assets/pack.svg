<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
  <defs>
    <linearGradient id="bagG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a170d" />
      <stop offset="16%" stop-color="#482d1b" />
      <stop offset="46%" stop-color="#3a2316" />
      <stop offset="80%" stop-color="#241309" />
      <stop offset="100%" stop-color="#120905" />
    </linearGradient>
    <linearGradient id="labelG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf7ea" />
      <stop offset="100%" stop-color="#e6d3b4" />
    </linearGradient>
    <radialGradient id="packShadG" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0a0503" stop-opacity=".62" />
      <stop offset="100%" stop-color="#0a0503" stop-opacity="0" />
    </radialGradient>
  </defs>

  <ellipse cx="180" cy="448" rx="140" ry="24" fill="url(#packShadG)" />

  <!-- pouch -->
  <path d="M62 108 Q62 90 80 90 L264 90 Q282 90 282 108 L294 414 Q296 446 264 446 L80 446 Q50 446 50 414 Z" fill="url(#bagG)" />
  <!-- top fold -->
  <path d="M60 96 Q60 82 76 82 L268 82 Q284 82 284 96 L285 128 L59 128 Z" fill="#1c0f07" />
  <path d="M59 128 L285 128 L285 134 L59 134 Z" fill="#c2873f" opacity=".45" />
  <path d="M66 98 L66 126" stroke="#000" stroke-width="2" opacity=".4" />
  <!-- gloss + side shade -->
  <path d="M62 108 L80 90 L120 90 L96 446 L80 446 Q50 446 50 414 Z" fill="#ffffff" opacity=".05" />
  <path d="M264 90 Q282 90 282 108 L294 414 Q296 446 264 446 L232 446 L256 90 Z" fill="#000000" opacity=".22" />
  <path d="M64 112 L52 408" stroke="#d8a86e" stroke-width="2" opacity=".22" />

  <!-- label -->
  <rect x="92" y="168" width="176" height="172" rx="18" fill="url(#labelG)" />
  <rect x="92" y="168" width="176" height="172" rx="18" fill="none" stroke="#c2873f" stroke-width="1.5" opacity=".5" />
  <text x="180" y="228" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="33" font-weight="700" letter-spacing="3" fill="#3c2416">BODRĒN</text>
  <rect x="132" y="242" width="96" height="2" rx="1" fill="#c2873f" />
  <text x="180" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="4" fill="#8c6a45">SPECIALTY COFFEE</text>
  <text x="180" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#a3815b">100% ARABICA · 250 Г</text>
  <text x="180" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" letter-spacing="3" fill="#b39672">ОБЖАРКА · СРЕДНЯЯ</text>

  <!-- turquoise seal -->
  <circle cx="252" cy="146" r="28" fill="#46b3a6" />
  <circle cx="252" cy="146" r="22" fill="none" stroke="#fdf7ec" stroke-width="1.5" opacity=".7" />
  <ellipse cx="252" cy="146" rx="8.5" ry="13.5" transform="rotate(-22 252 146)" fill="#fdf7ec" />
  <path d="M252 134c-4 4-4 20 0 24" fill="none" stroke="#2e8f84" stroke-width="2.5" stroke-linecap="round" transform="rotate(-22 252 146)" />

  <!-- beans beside the pouch -->
  <g transform="translate(24 400) rotate(-24)">
    <ellipse cx="0" cy="0" rx="15" ry="21" fill="#4a2b16" />
    <path d="M0 -18c-6 6-6 30 0 36" fill="none" stroke="#1c0e05" stroke-width="4" stroke-linecap="round" opacity=".8" />
  </g>
  <g transform="translate(336 388) rotate(18)">
    <ellipse cx="0" cy="0" rx="13" ry="18" fill="#3d2211" />
    <path d="M0 -15c-5 5-5 25 0 30" fill="none" stroke="#170b04" stroke-width="3.5" stroke-linecap="round" opacity=".8" />
  </g>
</svg>
