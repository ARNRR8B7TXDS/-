  <path d="M58 150 A118 24 0 0 1 132 132" fill="none" stroke="#ffffff" stroke-width="3" opacity=".4" />

  <text x="170" y="404" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="7" fill="#7a5433" opacity=".5">BODRĒN</text>
  <rect x="108" y="418" width="124" height="2" rx="1" fill="#7a5433" opacity=".3" />
