    <path d="M74 152C104 128 158 126 196 140C222 150 248 150 266 142C252 170 204 180 160 176C118 172 88 166 74 152Z" fill="#ead5b2" opacity=".92" />
    <path d="M104 170C130 156 176 154 206 164C226 170 244 170 258 166C244 184 200 190 164 188C134 186 114 180 104 170Z" fill="#f6e6cd" opacity=".85" />
