<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560">
  <defs>
    <radialGradient id="splashA" cx="34%" cy="22%" r="86%">
      <stop offset="0" stop-color="#f7d59c" />
      <stop offset="34%" stop-color="#e0a95c" />
      <stop offset="68%" stop-color="#b4762c" />
      <stop offset="100%" stop-color="#7d4413" />
    </radialGradient>
    <radialGradient id="splashB" cx="36%" cy="26%" r="80%">
      <stop offset="0" stop-color="#f6ce90" />
      <stop offset="60%" stop-color="#c9893c" />
      <stop offset="100%" stop-color="#8a4e18" />
    </radialGradient>
    <filter id="splashBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
  </defs>

  <!-- soft caramel glow behind the splash -->
  <ellipse cx="252" cy="286" rx="196" ry="212" fill="#c07a2e" opacity=".14" filter="url(#splashBlur)" />

  <!-- main suspended liquid mass -->
  <path
    d="M250 34C302 108 356 190 370 270C384 352 342 434 262 458C176 484 100 434 80 352C60 270 106 194 152 128C186 80 218 54 250 34Z"
    fill="url(#splashA)"
  />
  <!-- crown spikes -->
  <path d="M228 100C242 60 260 26 292 6C266 44 250 80 246 116Z" fill="url(#splashB)" />
  <path d="M300 148C326 114 358 90 398 78C356 104 326 134 310 166Z" fill="url(#splashB)" />
  <path d="M138 196C110 172 78 156 42 152C84 162 114 182 132 210Z" fill="url(#splashB)" />

  <!-- glossy highlights -->
  <path d="M180 150C230 208 262 282 254 366" fill="none" stroke="#fff4df" stroke-width="16" stroke-linecap="round" opacity=".22" filter="url(#splashBlur)" />
  <path d="M300 200C326 250 334 316 320 372" fill="none" stroke="#ffeccd" stroke-width="10" stroke-linecap="round" opacity=".18" filter="url(#splashBlur)" />
  <!-- shaded underside -->
  <path d="M118 344C124 396 174 442 240 434C286 428 320 404 336 372C316 424 262 462 198 456C146 450 112 404 118 344Z" fill="#6c3a0f" opacity=".35" />

  <!-- flying droplets -->
  <g fill="url(#splashB)">
    <ellipse cx="58" cy="96" rx="17" ry="20" />
    <ellipse cx="414" cy="142" rx="23" ry="26" />
    <ellipse cx="98" cy="308" rx="13" ry="15" />
    <ellipse cx="404" cy="316" rx="15" ry="17" />
    <ellipse cx="156" cy="48" rx="10" ry="12" />
    <ellipse cx="330" cy="492" rx="18" ry="21" />
    <ellipse cx="248" cy="522" rx="10" ry="12" />
    <ellipse cx="30" cy="212" rx="9" ry="11" />
  </g>
  <g fill="#f6d9ad" opacity=".5">
    <ellipse cx="52" cy="88" rx="5" ry="6" />
    <ellipse cx="406" cy="132" rx="7" ry="8" />
    <ellipse cx="152" cy="43" rx="3" ry="4" />
    <ellipse cx="324" cy="484" rx="5" ry="6" />
  </g>
